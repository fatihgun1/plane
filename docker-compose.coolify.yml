# Plane CE (+ Jira/Confluence migration app) — Coolify deployment.
#
# How it works on Coolify:
#  - The internal Caddy `proxy` does all path routing (/, /api, /live, /spaces,
#    /god-mode, /migrate, /uploads) and listens HTTP-only on :80 (SITE_ADDRESS=:80).
#  - Coolify's own reverse proxy terminates SSL and routes your domain -> proxy:80.
#    In Coolify: set the domain ONLY on the `proxy` service (port 80); leave every
#    other service's domain blank. SSL is issued by Coolify automatically.
#  - All env vars are set in Coolify's "Environment Variables" UI; Coolify writes
#    them to a .env that these services read via `env_file`.
#
# RESOURCES (sized for an ~8GB / 2-4 vCPU host):
#  - The `deploy.resources` blocks below cap RUNTIME memory/cpu so no single
#    service can exhaust the host. Runtime limits sum to ~6.6GB, leaving headroom.
#  - They do NOT limit the BUILD step. Building web/admin/space from source is
#    memory-heavy and is what froze the server. Add swap BEFORE deploying:
#      sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile
#      sudo mkswap /swapfile && sudo swapon /swapfile
#      echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
#    (Or build images in CI and pull them, so the host never builds.)
services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
        reservations: { memory: 128M }

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.75" }
        reservations: { memory: 64M }

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.75" }
        reservations: { memory: 64M }

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - .env
    environment:
      # Override the shared PORT (which is 3000 for the live server) — gunicorn
      # must bind 8000 because the proxy routes /api -> api:8000.
      PORT: "8000"
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    deploy:
      resources:
        limits: { memory: 1024M, cpus: "1.5" }
        reservations: { memory: 256M }

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - .env
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }
        reservations: { memory: 256M }

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - .env
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }
        reservations: { memory: 64M }

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - .env
    depends_on:
      - plane-db
      - plane-redis
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - .env
    depends_on:
      - api
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
        reservations: { memory: 128M }

  migration:
    container_name: migration
    build:
      context: ./apps/migration
      dockerfile: Dockerfile.migration
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    environment:
      URL_PREFIX: /migrate
      DB_PATH: /data/optimization.db
      SECRET_KEY: ${FLASK_SECRET_KEY}
      PLANE_API_URL: http://api:8000
    volumes:
      - migration_data:/data
    depends_on:
      - api
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.75" }
        reservations: { memory: 64M }

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    deploy:
      resources:
        limits: { memory: 1024M, cpus: "1.0" }
        reservations: { memory: 256M }

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.5" }
        reservations: { memory: 64M }

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.75" }
        reservations: { memory: 128M }

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
        reservations: { memory: 128M }

  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    # No host ports — Coolify's reverse proxy owns 80/443 and routes your
    # domain to this service's port 80. Set the domain on THIS service in Coolify.
    expose:
      - "80"
    environment:
      # Coolify magic var: route this FQDN to the proxy on container port 80.
      # MUST be a bare hostname (no https://). Change this to your own domain.
      SERVICE_FQDN_PROXY_80: nttdata.seansyonetim.com
      SITE_ADDRESS: ":80"
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
    depends_on:
      - web
      - api
      - space
      - admin
      - live
      - migration
    deploy:
      resources:
        limits: { memory: 192M, cpus: "0.5" }
        reservations: { memory: 32M }

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
  migration_data:
